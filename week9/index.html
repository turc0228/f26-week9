        <main>
            <article>
                <h3>Stuff About Kittens</h3>
                <!-- prompt to add placeholder content:
                 in the article, under the h3, add two paragraphs with placeholder content about kittens -->

                    Kittens are tiny explorers with bright eyes and soft paws, always curious about the world around them.
                </p>
                <p>
                    They spend their days pouncing on toys, napping in warm sunbeams, and making everyone smile with their playful energy.
